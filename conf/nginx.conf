# Urlix - OpenResty / Nginx configuration
# Creator: Blitz (blitzlabx)
# PORT is substituted by scripts/entrypoint.sh for Render compatibility

worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 1m;

    # Rate-limit shared memory
    lua_shared_dict urlix_ratelimit 10m;

    # Lua package path
    lua_package_path "/app/lua/?.lua;/app/lua/?/init.lua;;";
    lua_code_cache on;

    # Resolver for outbound DNS (SSRF checks + resty.http)
    resolver 8.8.8.8 1.1.1.1 8.8.4.4 ipv6=off valid=300s;
    resolver_timeout 5s;

    # Real IP behind proxy (Render)
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    init_by_lua_block {
        require "config"
        require "utils.json"
        require "utils.response"
        require "utils.ip"
        require "services.security"
        require "services.url_parser"
        require "services.fetcher"
        require "middleware.rate_limit"
        require "handlers.health"
        require "handlers.analyze"
        require "router"
    }

    server {
        # listen directive is rewritten by entrypoint.sh to use $PORT
        listen 8080;

        server_name _;
        root /app/static;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location ~ ^/(ping|health|healthz|api) {
            default_type application/json;
            content_by_lua_block {
                local router = require "router"
                router.dispatch()
            }
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location @static {
            try_files $uri $uri/ /index.html;
        }

        location ~ /\. {
            deny all;
        }
    }
}
